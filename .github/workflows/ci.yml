name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build client bundle
        run: npm run build

      # The build must be reproducible: a stale lib/client.js means the
      # published package would ship code that does not match src/.
      - name: Verify bundle is up to date
        run: |
          git diff --exit-code -- lib/client.js src/card-css.js \
            || (echo "::error::lib/client.js is out of date — run npm run build and commit" && exit 1)

      - name: Self-tests (protocol, bundle surface, promotion, regressions)
        run: npm run check

      - name: Security tests (action ownership)
        run: npm run check:security

      - name: Boundary tests (render failure isolation)
        run: npm run check:boundary

      - name: End-to-end chain
        run: node tools/e2e-full.mjs

      - name: Type declarations parse
        run: npx --yes typescript@5 tsc --noEmit --allowJs false index.d.ts

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Inspect published contents
        run: npm pack --dry-run
      - name: Ensure the tarball has no source or test files
        run: |
          npm pack --silent > /dev/null
          tar -tzf dsh-tool-cards-*.tgz | tee files.txt
          if grep -E '^package/(src|tools)/' files.txt; then
            echo "::error::tarball must not include src/ or tools/"
            exit 1
          fi
